name: shopnepal
description: "Wholesale import and stock management."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Routing
  auto_route: ^11.1.0

  # Networking
  dio: ^5.3.2

  # State
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Storage
  flutter_secure_storage: ^10.0.0

  # Device / platform
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.1
  image_picker: ^1.1.2

  # Misc
  collection: ^1.19.1
  logger: ^2.7.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  auto_route_generator: ^10.4.0
  build_runner: ^2.4.12

flutter_icons:
  android: "ic_launcher"
  ios: true
  remote_alpha_ios: true
  image_path: "assets/image/app_icon/app_icon.png"
  adaptive_icon_background: "assets/image/app_icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/image/app_icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/image/app_icon/
    - assets/svg/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
